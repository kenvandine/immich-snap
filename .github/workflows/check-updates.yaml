name: Check for updates

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install skopeo and ruamel.yaml
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          pip install --user ruamel.yaml

      - name: Check server-image and ml-image against the latest immich release
        id: check
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from ruamel.yaml import YAML

          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.width = 4096
          yaml_path = "snap/snapcraft.yaml"
          with open(yaml_path) as f:
              data = yaml.load(f)

          req = urllib.request.Request(
              "https://api.github.com/repos/immich-app/immich/releases/latest",
              headers={"Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as r:
              tag = json.load(r)["tag_name"]  # e.g. "v3.0.3"
          version = tag.lstrip("v")

          def digest_for(image, tag):
              out = subprocess.run(
                  ["skopeo", "inspect", f"docker://{image}:{tag}"],
                  capture_output=True, text=True, check=True,
              ).stdout
              return json.loads(out)["Digest"]  # "sha256:...."

          # Maps each part that extracts an OCI image payload to the image it
          # tracks. Parts staging from the Ubuntu archive (postgres, redis,
          # runtime-deps) already float with the archive and need no pin here.
          images = {
              "server-image": "ghcr.io/immich-app/immich-server",
              "ml-image": "ghcr.io/immich-app/immich-machine-learning",
          }

          updates = []
          for part_name, image in images.items():
              part = data["parts"][part_name]
              pull = part["override-pull"]
              current_match = re.search(rf"{re.escape(image)}@sha256:([0-9a-f]+)", pull)
              current_digest = current_match.group(1) if current_match else None

              new_digest_full = digest_for(image, tag)  # "sha256:abcd..."
              new_digest = new_digest_full.split(":", 1)[1]

              if new_digest != current_digest:
                  part["override-pull"] = re.sub(
                      rf"{re.escape(image)}@sha256:[0-9a-f]+",
                      f"{image}@{new_digest_full}",
                      pull,
                  )
                  if "override-build" in part:
                      part["override-build"] = re.sub(
                          r'craftctl set version="[^"]*"',
                          f'craftctl set version="{version}"',
                          part["override-build"],
                      )
                  updates.append({
                      "part": part_name,
                      "current": current_digest,
                      "latest": new_digest,
                      "note": f"https://github.com/immich-app/immich/releases/tag/{tag}",
                  })

          with open(yaml_path, "w") as f:
              yaml.dump(data, f)

          with open("/tmp/updates.json", "w") as f:
              json.dump(updates, f)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"update_needed={'true' if updates else 'false'}\n")

          for u in updates:
              print(u)
          PYEOF

      - name: Build PR metadata
        if: steps.check.outputs.update_needed == 'true'
        id: pr_meta
        run: |
          python3 << 'PYEOF'
          import json
          import os

          updates = json.load(open("/tmp/updates.json"))
          title = "Update " + ", ".join(u["part"] for u in updates)
          body_lines = [
              "Automated update to track the latest immich release.",
              "",
              "**Changes:**",
          ]
          for u in updates:
              body_lines.append(f"- **{u['part']}**: `{u['current']}` → `{u['latest']}` ({u['note']})")
          body = "\n".join(body_lines)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"title={title}\n")
              f.write(f"body<<PREOF\n{body}\nPREOF\n")
          PYEOF

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "${{ steps.pr_meta.outputs.title }}"
          title: "${{ steps.pr_meta.outputs.title }}"
          body: "${{ steps.pr_meta.outputs.body }}"
          branch: update-parts
          delete-branch: true
